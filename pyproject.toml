[project]
name = "loki-redteam"
version = "0.1.0"
description = "Loki — Adaptive AI Red-Teaming & Reliability Evaluation Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "weasyprint>=60",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.40", "datasets>=2.19", "accelerate>=0.30", "sentence-transformers>=2.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
loki = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
