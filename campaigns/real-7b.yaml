# Real-model campaign — Qwen2.5-7B-Instruct, local, no API key (Phase 3).
#   loki run campaigns/real-7b.yaml --db artifacts/loki_real_7b.db
#
# Sizing notes: the 7B generates ~20-40 tok/s on MPS, so max_tokens is capped at
# 160 to bound worst-case latency (DoS-family prompts would otherwise run to the
# full budget on every probe). concurrency=1 because a single local model
# serializes on the GPU anyway — parallelism buys nothing and costs memory.
name: real-hf-7b
seed: 42
generations: 2
population_size: 8
concurrency: 1
matrix_trials: 2
reproduction_trials: 10
budget:
  max_calls: 220
  max_wall_clock_s: 9000
techniques: []
owasp_scope: []
targets:
  - {name: chat-tier0, kind: chat, tier: tier-0, backend: hf, model: Qwen/Qwen2.5-7B-Instruct, extra: {max_tokens: 160}}
  - {name: chat-tier1, kind: chat, tier: tier-1, backend: hf, model: Qwen/Qwen2.5-7B-Instruct, extra: {max_tokens: 160}}
  - {name: chat-tier2, kind: chat, tier: tier-2, backend: hf, model: Qwen/Qwen2.5-7B-Instruct, extra: {max_tokens: 160}}
  - {name: agent-target, kind: agent, backend: hf, model: Qwen/Qwen2.5-7B-Instruct, extra: {max_tokens: 96, max_steps: 2}}
  - {name: rag-target, kind: rag, backend: hf, model: Qwen/Qwen2.5-7B-Instruct, extra: {max_tokens: 160}}
